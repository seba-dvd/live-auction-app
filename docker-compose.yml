# Live Auction App: the whole stack.
#   cp .env.example .env
#   docker compose up -d --build        # app: http://localhost:3000, gateway: http://localhost:8080
# docker-compose.override.yml is loaded automatically in development and publishes MySQL + the service ports.
# Only the api-gateway (8080) and the front-end (3000) are published here.
name: live-auction

x-spring-service: &spring-service
  restart: unless-stopped
  mem_limit: 512m
  networks: [auction-net]

x-healthcheck-timing: &healthcheck-timing
  interval: 10s
  timeout: 5s
  retries: 12
  start_period: 60s

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?copy .env.example to .env first}
      USER_DB_USERNAME: ${USER_DB_USERNAME:-user_service}
      USER_DB_PASSWORD: ${USER_DB_PASSWORD:?missing in .env}
      AUCTION_DB_USERNAME: ${AUCTION_DB_USERNAME:-auction_service}
      AUCTION_DB_PASSWORD: ${AUCTION_DB_PASSWORD:?missing in .env}
      BIDDING_DB_USERNAME: ${BIDDING_DB_USERNAME:-bidding_service}
      BIDDING_DB_PASSWORD: ${BIDDING_DB_PASSWORD:?missing in .env}
      TZ: UTC
    volumes:
      - mysql-data:/var/lib/mysql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # TCP ping fails while the init scripts run (the server is started with --skip-networking),
      # so "healthy" means: initialization finished and MySQL accepts connections.
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks: [auction-net]

  user-service:
    <<: *spring-service
    build: ./user-service
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      USER_DB_USERNAME: ${USER_DB_USERNAME:-user_service}
      USER_DB_PASSWORD: ${USER_DB_PASSWORD:?missing in .env}
      JWT_SECRET: ${JWT_SECRET:?missing in .env}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-60}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?missing in .env}
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/actuator/health"]
      <<: *healthcheck-timing

  auction-service:
    <<: *spring-service
    build: ./auction-service
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      AUCTION_DB_USERNAME: ${AUCTION_DB_USERNAME:-auction_service}
      AUCTION_DB_PASSWORD: ${AUCTION_DB_PASSWORD:?missing in .env}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?missing in .env}
      USER_SERVICE_URL: http://user-service:8081
      NOTIFICATION_SERVICE_URL: http://notification-service:8084
      UPLOAD_DIR: /app/uploads
    volumes:
      - auction-uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8082/actuator/health"]
      <<: *healthcheck-timing

  bidding-service:
    <<: *spring-service
    build: ./bidding-service
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      BIDDING_DB_USERNAME: ${BIDDING_DB_USERNAME:-bidding_service}
      BIDDING_DB_PASSWORD: ${BIDDING_DB_PASSWORD:?missing in .env}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?missing in .env}
      USER_SERVICE_URL: http://user-service:8081
      AUCTION_SERVICE_URL: http://auction-service:8082
      NOTIFICATION_SERVICE_URL: http://notification-service:8084
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8083/actuator/health"]
      <<: *healthcheck-timing

  notification-service:
    <<: *spring-service
    build: ./notification-service
    environment:
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?missing in .env}
      JWT_SECRET: ${JWT_SECRET:?missing in .env}
      WS_ALLOWED_ORIGIN_PATTERNS: ${WS_ALLOWED_ORIGIN_PATTERNS:-http://localhost:*,http://127.0.0.1:*}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8084/actuator/health"]
      <<: *healthcheck-timing

  api-gateway:
    <<: *spring-service
    build: ./api-gateway
    ports:
      - "8080:8080"
    environment:
      USER_SERVICE_URL: http://user-service:8081
      AUCTION_SERVICE_URL: http://auction-service:8082
      BIDDING_SERVICE_URL: http://bidding-service:8083
      NOTIFICATION_SERVICE_WS_URL: ws://notification-service:8084
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000}
      JWT_SECRET: ${JWT_SECRET:?missing in .env}
    depends_on:
      user-service:
        condition: service_healthy
      auction-service:
        condition: service_healthy
      bidding-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      <<: *healthcheck-timing

  frontend:
    build: ./frontend
    restart: unless-stopped
    mem_limit: 128m
    ports:
      - "3000:80"
    depends_on:
      api-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 6
    networks: [auction-net]

networks:
  auction-net:

volumes:
  mysql-data:
  auction-uploads:
