# Profile for fast tests without MySQL/Docker (context-load and service tests).
# Real MySQL + Flyway migrations + ddl-auto=validate run in Docker Compose and in Testcontainers tests.
spring:
  datasource:
    url: jdbc:h2:mem:auction_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop

app:
  scheduling:
    enabled: false
