server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: user-service
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/user_db?connectionTimeZone=UTC
    username: ${USER_DB_USERNAME:user_service}
    password: ${USER_DB_PASSWORD:user-service-dev-pw}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        # java.time.Instant -> DATETIME(6) (Hibernate's default for Instant would be MySQL TIMESTAMP).
        type:
          preferred_instant_jdbc_type: TIMESTAMP
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  # Shared secret expected in the X-Internal-Key header of /internal/** calls.
  internal-api-key: ${INTERNAL_API_KEY:dev-only-internal-api-key}
  jwt:
    # HS256 secret (>= 32 bytes) shared with the api-gateway and notification-service.
    secret: ${JWT_SECRET:dev-only-jwt-secret-change-me-0123456789abcdef}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
  wallet:
    signup-bonus: 1000
    max-top-up: 10000
