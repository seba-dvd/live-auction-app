# CI: builds and tests only what changed (pull requests to main always build everything).
# Required status checks on develop/main are added later by R (see docs/team/R.md).
name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.detect.outputs.services }}
      frontend: ${{ steps.detect.outputs.frontend }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: detect
        name: Compute what to build
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          SERVICES="api-gateway user-service auction-service bidding-service notification-service"
          build_all=false
          changed=""
          if [ "$EVENT" = "pull_request" ]; then
            if [ "$BASE_REF" = "main" ]; then
              build_all=true
            else
              changed=$(git diff --name-only "origin/$BASE_REF...HEAD")
            fi
          elif [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
               || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            build_all=true   # first push of a branch: build everything
          else
            changed=$(git diff --name-only "$BEFORE" "$GITHUB_SHA")
          fi
          if echo "$changed" | grep -q '^\.github/workflows/'; then build_all=true; fi

          selected=""
          for s in $SERVICES; do
            if [ "$build_all" = true ] || echo "$changed" | grep -q "^$s/"; then selected="$selected $s"; fi
          done
          if [ "$build_all" = true ] || echo "$changed" | grep -q '^frontend/'; then frontend=true; else frontend=false; fi

          services_json=$(printf '%s\n' $selected | jq -R . | jq -sc 'map(select(length > 0))')
          echo "services=$services_json" >> "$GITHUB_OUTPUT"
          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"
          echo "Backend services: $services_json | frontend: $frontend"

  backend:
    name: ${{ matrix.service }}
    needs: changes
    if: needs.changes.outputs.services != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: ${{ matrix.service }}/pom.xml

      - name: Build and test
        run: ./mvnw -B verify

  frontend:
    name: frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run build
