server:
  port: ${SERVER_PORT:8083}

spring:
  application:
    name: bidding-service
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/bidding_db?connectionTimeZone=UTC
    username: ${BIDDING_DB_USERNAME:bidding_service}
    password: ${BIDDING_DB_PASSWORD:bidding-service-dev-pw}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        # java.time.Instant -> DATETIME(6) (Hibernate's default for Instant would be MySQL TIMESTAMP).
        type:
          preferred_instant_jdbc_type: TIMESTAMP
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  internal-api-key: ${INTERNAL_API_KEY:dev-only-internal-api-key}
  clients:
    user-service-url: ${USER_SERVICE_URL:http://localhost:8081}
    auction-service-url: ${AUCTION_SERVICE_URL:http://localhost:8082}
    notification-service-url: ${NOTIFICATION_SERVICE_URL:http://localhost:8084}
    connect-timeout: 2s
    read-timeout: 5s
