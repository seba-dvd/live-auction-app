# Development overrides, loaded AUTOMATICALLY by "docker compose up" (not used in production).
# Publishes MySQL (IntelliJ, MySQL Workbench) and every service port (Swagger UI, direct tests with X-User-Id / X-Internal-Key).
# A local MySQL Server already on 3306? Set MYSQL_HOST_PORT=3307 in .env and DB_PORT=3307 in your IntelliJ run configuration.
services:
  mysql:
    ports:
      - "${MYSQL_HOST_PORT:-3306}:3306"

  user-service:
    ports:
      - "8081:8081"

  auction-service:
    ports:
      - "8082:8082"

  bidding-service:
    ports:
      - "8083:8083"

  notification-service:
    ports:
      - "8084:8084"
